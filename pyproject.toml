[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-processing"
version = "0.1.0"
description = "CLI para procesado de audio orientado a edicion de video."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3.0",
  "scipy>=1.14,<2.0",
  "soundfile>=0.12,<1.0",
  "pyloudnorm>=0.1.1,<0.3",
  "noisereduce>=3.0,<4.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.6,<1.0",
]
build-win = [
  "pyinstaller>=6.11,<7.0",
]

[project.scripts]
video-processing = "video_processing.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/video_processing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".tmp", ".venv", "pytest-cache-files-*"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4"]
