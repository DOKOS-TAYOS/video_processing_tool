[app]
default_output_format = "wav"
sample_rate = 48000

[paths]
filter_curve_csv = "user_curve.csv"
default_filter_curve_csv = "audacity_default_curve.csv"

[noise_profile]
start_seconds = 1.0
duration_seconds = 1.0

[noise_reduction]
reduction_db = 9.0
sensitivity = 6.0
smoothing = 3.0

[loudness]
target_lufs = -17.0

[peak_normalization]
target_peak_db = -1.0

[compression]
threshold_db = -18.0
ratio = 2.5
attack_ms = 5.0
release_ms = 100.0
makeup_gain_db = 1.0

[sync_detection]
speech_window_ms = 40
speech_min_duration_ms = 250
speech_threshold_dbfs = -32.0
loud_sound_window_ms = 15
loud_sound_threshold_dbfs = -12.0

[silence_editing]
silence_threshold_dbfs = -38.0
min_trim_silence_seconds = 0.8
long_pause_seconds = 2.0
edge_padding_seconds = 0.1

[pause_marker]
beep_frequency_hz = 1000.0
beep_duration_ms = 120
beep_level_dbfs = -12.0
fade_ms = 10
